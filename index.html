<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บัตรสมาชิกดิจิทัล</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 28px 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-sizing: border-box;
    }
    .status {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 12px;
    }
    .shop-name {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin: 10px auto;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
      font-family: monospace;
      letter-spacing: 2px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #06c755;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="status" class="status">กำลังเชื่อมต่อ LINE...</div>

    <!-- ฟอร์มลงทะเบียนครั้งแรก -->
    <div id="bindSection" style="display: none;">
      <h3 style="margin-top: 0; color: #1e293b; font-size: 17px;">ลงทะเบียนบัตรสมาชิก</h3>
      <p style="font-size: 13px; color: #64748b; margin-bottom: 16px;">
        กรอกเลข RFID บนบัตรของคุณเพื่อผูกข้อมูลเข้ากับบัญชี LINE
      </p>
      <input type="text" id="rfidInput" placeholder="เลข RFID 10 หลัก" maxlength="10">
      <button onclick="bindAccount()">ยืนยัน</button>
    </div>

    <!-- บัตรสมาชิกดิจิทัล -->
    <div id="cardSection" style="display: none;">
      <div id="shopName" class="shop-name"></div>
      <div id="qrcode"></div>
    </div>
  </div>

  <script>
    const MY_LIFF_ID = "2012173583-rp3RTemX"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxIjN53ODjYwtWw1IHNsc6PCbiI9adPzvhiNgx0ZbZ5Qhalv2cjLDULdfW9xd4fBTzE/exec"; // วาง Web App URL ที่ลงท้ายด้วย /exec ตรงนี้

    let currentLineUid = "";

    async function initApp() {
      const statusEl = document.getElementById("status");
      try {
        await liff.init({ liffId: MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        currentLineUid = profile.userId;

        statusEl.innerText = "กำลังตรวจสอบข้อมูล...";

        const res = await fetch(`${GAS_URL}?action=check_liff&userId=${encodeURIComponent(currentLineUid)}`);
        const data = await res.json();

        if (data.success && data.isBound) {
          showCard(data.customerName, data.rfid);
        } else {
          statusEl.style.display = "none";
          document.getElementById("bindSection").style.display = "block";
        }
      } catch (err) {
        statusEl.innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
      }
    }

    async function bindAccount() {
      const rfid = document.getElementById("rfidInput").value.trim();
      const statusEl = document.getElementById("status");

      if (!rfid) {
        alert("กรุณากรอกเลข RFID");
        return;
      }

      statusEl.style.display = "block";
      statusEl.innerText = "กำลังบันทึกข้อมูล...";

      try {
        const res = await fetch(`${GAS_URL}?action=bind_liff&userId=${encodeURIComponent(currentLineUid)}&rfid=${encodeURIComponent(rfid)}`);
        const data = await res.json();

        if (data.success) {
          document.getElementById("bindSection").style.display = "none";
          showCard(data.customerName, data.rfid);
        } else {
          statusEl.style.display = "none";
          alert(data.message || "บันทึกไม่สำเร็จ");
        }
      } catch (e) {
        statusEl.style.display = "none";
        alert("ไม่สามารถติดต่อเซิร์ฟเวอร์ได้");
      }
    }

    function showCard(name, rfid) {
      document.getElementById("status").style.display = "none";
      document.getElementById("shopName").innerText = name;

      const qrcodeEl = document.getElementById("qrcode");
      qrcodeEl.innerHTML = "";

      new QRCode(qrcodeEl, {
        text: rfid,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById("cardSection").style.display = "block";

      // อัปเดตเวลาเปิด QR Code ลงฐานข้อมูล
      fetch(`${GAS_URL}?action=log_qr&rfid=${encodeURIComponent(rfid)}`).catch(() => {});
    }

    initApp();
  </script>
</body>
</html>
