<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบข้อมูล RFID / Key Tag</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .result {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      display: none;
    }
  </style>
</head>
<body>

  <div class="box">
    <h3 style="margin-top:0;">ตรวจสอบ Tag ID</h3>
    <input type="text" id="tagInput" placeholder="สแกนหรือกรอกเลข RFID 10 หลัก" autofocus>
    <button onclick="checkTag()">ค้นหาข้อมูล</button>

    <div id="resultBox" class="result">
      <div><strong>เลข RFID:</strong> <span id="resRfid"></span></div>
      <div style="margin-top:6px;"><strong>ชื่อลูกค้า:</strong> <span id="resName"></span></div>
    </div>
    <div id="errorMsg" style="color: #ef4444; margin-top: 10px; font-size: 14px;"></div>
  </div>

  <script>
    const GAS_URL = "URL_GOOGLE_APPS_SCRIPT_EXEC"; // ใส่ URL ที่ได้จากการ Deploy Apps Script

    async function checkTag() {
      const tagId = document.getElementById("tagInput").value.trim();
      const resBox = document.getElementById("resultBox");
      const errBox = document.getElementById("errorMsg");
      
      resBox.style.display = "none";
      errBox.innerText = "";

      if (!tagId) return;

      try {
        errBox.innerText = "กำลังค้นหา...";
        const res = await fetch(`${GAS_URL}?tagId=${encodeURIComponent(tagId)}`);
        const data = await res.json();
        errBox.innerText = "";

        if (data.success) {
          document.getElementById("resRfid").innerText = data.memberId;
          document.getElementById("resName").innerText = data.customerName;
          resBox.style.display = "block";
        } else {
          errBox.innerText = "ไม่พบข้อมูล RFID นี้ในระบบ";
        }
      } catch (e) {
        errBox.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
      }
    }

    // กด Enter เพื่อค้นหาได้ทันที
    document.getElementById("tagInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") checkTag();
    });
  </script>
</body>
</html>
